name: Example bug
description: Report a reproducible problem in this repository.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include API keys, webhook secrets, private media URLs, or customer data.
  - type: input
    id: example
    attributes:
      label: Example path
      placeholder: examples/node/music-video.mjs
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Replace all credentials and private URLs with placeholders.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime version
      placeholder: Node.js 20.15 or Python 3.11
    validations:
      required: true
