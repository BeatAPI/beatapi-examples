name: Live read-only smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BEATAPI_API_KEY: ${{ secrets.BEATAPI_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22.12"
          cache: npm

      - run: npm ci
      - run: npm run smoke:live
